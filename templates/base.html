<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TCNN Portal{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fa; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem max(1.25rem, calc((100% - 60rem) / 2)); background: #17365d; color: white; }
        header a { color: white; text-decoration: none; font-weight: 700; }
        .account { display: flex; align-items: center; gap: 1rem; }
        button { border: 0; border-radius: .35rem; padding: .6rem .9rem; color: #17365d; background: white; font: inherit; cursor: pointer; }
        main { width: min(100% - 2rem, 42rem); margin: 3rem auto; padding: 2rem; background: white; border-radius: .6rem; box-shadow: 0 1rem 2.5rem #17365d12; }
        h1 { margin-top: 0; }
        form p { display: grid; gap: .4rem; margin: 1rem 0; }
        input { width: 100%; padding: .65rem; border: 1px solid #aeb9c8; border-radius: .3rem; font: inherit; }
        main button { color: white; background: #17365d; }
        ul.errorlist { color: #a12222; }
        @media (max-width: 34rem) {
            header { align-items: flex-start; flex-direction: column; }
            main { margin-top: 1.25rem; padding: 1.25rem; }
        }
    </style>
</head>
<body>
    <header>
        <span>TCNN Portal</span>
        {% if request.user.is_authenticated %}
            <div class="account">
                <span>{% firstof request.user.get_full_name request.user.username %}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            </div>
        {% endif %}
    </header>
    <main>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
