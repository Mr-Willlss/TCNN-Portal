{% extends "base.html" %}

{% block title %}Change password | TCNN Portal{% endblock %}

{% block content %}
    <h1>Change password</h1>
    <p>Set a new password before continuing.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change password</button>
    </form>
{% endblock %}
