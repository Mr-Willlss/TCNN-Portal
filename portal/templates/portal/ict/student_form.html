{% extends "base.html" %}

{% block title %}{{ heading }} | ICT | TCNN Portal{% endblock %}

{% block content %}
    <h1>{{ heading }}</h1>
    <p><a href="{% url 'ict_students' %}">Back to students</a></p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save student</button>
    </form>
{% endblock %}
