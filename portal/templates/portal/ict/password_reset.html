{% extends "base.html" %}

{% block title %}Reset password | ICT | TCNN Portal{% endblock %}

{% block content %}
    <h1>Reset password</h1>
    <p>Set a temporary password for {{ staff_user.username }}.</p>
    <p><a href="{% url 'ict_staff' %}">Back to staff accounts</a></p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset password</button>
    </form>
{% endblock %}
